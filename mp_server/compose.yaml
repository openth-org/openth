# OpenTH multiplayer server. On the VPS:
#   docker compose up -d          start (pulls the published image)
#   docker compose logs -f        follow the log
#   docker compose pull && docker compose up -d   update
# See docs/multiplayer/vps-guide.md.
#
# To build from this checkout instead of pulling: docker compose up -d --build

services:
  openth-server:
    image: ghcr.io/openth-org/openth-server:${OPENTH_TAG:-latest}
    build: .
    container_name: openth-server
    restart: unless-stopped
    ports:
      # Players connect here; the server port inside stays 47800.
      - "${OPENTH_PUBLISH:-47800}:47800/tcp"
    environment:
      OPENTH_LOG: ${OPENTH_LOG:-INFO}
      OPENTH_MOTD: ${OPENTH_MOTD:-}
      OPENTH_MAX_CONNECTIONS: ${OPENTH_MAX_CONNECTIONS:-256}
      OPENTH_MAX_PER_ADDRESS: ${OPENTH_MAX_PER_ADDRESS:-8}
    # The server needs nothing from the host: no writable files, no
    # capabilities, no privileges.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Later (headless referee, milestone S3): the referee needs Theme Hospital
    # data from your own copy, mounted read-only, never baked into the image:
    # volumes:
    #   - /srv/openth/themehos:/data/themehos:ro
